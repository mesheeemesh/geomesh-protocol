# Prometheus configuration for geomesh-protocol metrics collection
global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files:
  - "alert-rules.yml"
  - "geomesh-protocol-exporter-rules.yml"

scrape_configs:
  - job_name: "geomesh-protocol-backend"
    static_configs:
      - targets: ["localhost:3000"]
    metrics_path: /metrics

  - job_name: "node-exporter"
    static_configs:
      - targets: ["localhost:9100"]

  # Custom geomesh-protocol exporters (from scrape-configs.yml)
  - job_name: "geomesh-protocol-gist-exporter"
    static_configs:
      - targets: ["geomesh-protocol-monitoring:9101"]
    metrics_path: /metrics
    scrape_interval: 30s
    scrape_timeout: 10s

  - job_name: "geomesh-protocol-soroban-exporter"
    static_configs:
      - targets: ["geomesh-protocol-monitoring:9102"]
    metrics_path: /metrics
    scrape_interval: 30s
    scrape_timeout: 15s

  - job_name: "geomesh-protocol-postgres-exporter"
    static_configs:
      - targets: ["postgres-exporter:9187"]
    metrics_path: /metrics
    scrape_interval: 30s
    scrape_timeout: 10s